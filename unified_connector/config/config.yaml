# The connector's configuration: one file for every protocol. Copy it, then:
#   1. Set the environment variables it reads: ZEROBUS_ENDPOINT (<workspace-id>.zerobus.<region>.cloud.databricks.com),
#      DATABRICKS_HOST (https://<workspace>.cloud.databricks.com), DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET
#      (a service principal with USE CATALOG, USE SCHEMA, MODIFY and SELECT on the target tables), and the
#      passwords of the sources you use. Never write a secret into this file.
#   2. Under sources:, set enabled: true on the example sources you need (all are off) and fill in your
#      endpoints, or delete the others; add more sources of any protocol the same way.
#   3. Set zerobus.default_target to your table (and a source's target_table for a table of its own).
# Run: python -m unified_connector --config <your copy>. The web page's source and ZeroBus edits are saved
# back into the file it was started with, placeholders kept.
connector:
  name: Unified OT Zerobus Connector Client
  log_level: INFO
  log_file: /tmp/unified_connector.log
bridge:
  autostart: true
web_ui:
  enabled: true
  host: 0.0.0.0
  port: 8001
  auto_open_browser: false
  authentication:
    enabled: false
    method: client_cert
    require_mfa: false
    oauth:
      provider: databricks
      client_id: ''
      client_secret: ''
      workspace_host: '${env:DATABRICKS_HOST:}'
      redirect_uri: http://localhost:8082/login/callback
      scopes:
      - all-apis
    session:
      secret_key: ''
      max_age_seconds: 28800
      cookie_name: unified_connector_session
      secure: false
      httponly: true
      samesite: lax
    rbac:
      enabled: true
      roles:
        admin:
          permissions:
          - read
          - write
          - configure
          - manage_users
          - start_stop
          - delete
        operator:
          permissions:
          - read
          - write
          - start_stop
        viewer:
          permissions:
          - read
      role_mappings:
        OT-Admins: admin
        OT-Operators: operator
        OT-Viewers: viewer
      default_role: viewer
    client_cert:
      role_mappings:
        admin: admin
        operator: operator
        viewer: viewer
        client-admin: admin
        client-operator: operator
        client-viewer: viewer
      default_role: viewer
  tls:
    enabled: false
    common_name: localhost
    san_list:
    - localhost
    - 127.0.0.1
    - ::1
    cert_file: ~/.unified_connector/certs/server-cert.pem
    key_file: ~/.unified_connector/certs/server-key.pem
    ca_cert_file: ~/.unified_connector/certs/ca-cert.pem
    hsts:
      max_age: 31536000
      include_subdomains: true
      preload: false
    require_client_cert: true
discovery:
  enabled: true
  network:
    scan_enabled: true
    scan_interval_sec: 300
    subnets:
    - 127.0.0.1/32
    - 192.168.20.0/24
  opcua:
    enabled: true
    default_port: 4840
    vendor_ports:
    - 4841
    - 49320
    - 4897
    timeout_sec: 5.0
  mqtt:
    enabled: true
    default_port: 1883
    default_tls_port: 8883
    timeout_sec: 3.0
  modbus:
    enabled: true
    default_tcp_port: 502
    alt_tcp_port: 5020
    timeout_sec: 2.0
sources:
# OPC-UA: polls (or subscribes to) the server's variables; here with its own numeric compression
- name: opcua-example
  protocol: opcua
  enabled: false
  endpoint: opc.tcp://127.0.0.1:4841/ot-simulator/server/
  security_mode: None
  normalization_enabled: true
  subscription_mode: false
  polling_interval_ms: 5000
  variable_limit: 300
  publishing_interval_ms: 1000
  numeric_compression:
    mode: sdt
    change_only: true
    sdt_deviation: 0.15
    sdt_max_interval_ms: 300000
# MQTT: plain topics (for Sparkplug B topics use the sparkplug source below)
- name: mqtt-example
  protocol: mqtt
  enabled: false
  endpoint: mqtt://127.0.0.1:1883
  normalization_enabled: true
  subscription_mode: true
# Modbus TCP
- name: modbus-example
  protocol: modbus
  enabled: false
  endpoint: modbus://127.0.0.1:5020
  normalization_enabled: true
# Sparkplug B: one row per message in a table of its own (target_table; its columns differ from the other
# protocols'), optionally the edges' primary host and a procedure call per NBIRTH (unified_connector/sparkplug/README.md)
- name: sparkplug-example
  protocol: sparkplug
  enabled: false
  endpoint: '${env:SPARKPLUG_MQTT_ENDPOINT:mqtt://localhost:1883}'
  target_table: bridge_stage_db.stage_db.sparkplug_raw
  client_id: databricks-sparkplug
  username: '${env:SPARKPLUG_MQTT_USERNAME:}'
  password: '${env:SPARKPLUG_MQTT_PASSWORD:}'
  primary_host_id: ''              # the edges' Primary Host ID, e.g. databricks-zerobus; empty: not a primary host
  state_format: v3
  offline_after_seconds: 30
  online_after_seconds: 30
  edge_node_schemas:
    enabled: false
    warehouse_id: ''
    procedures: [bridge_node_db.stage_db.create_edge_node_schema]
    schema_prefix: nb
normalization:
  enabled: true
  path_template: '{site}/{area}/{line}/{equipment}/{signal_type}/{tag_name}'
  default_context:
    site: plant1
    area: production
    line: line1
    equipment: default
  quality_mapping:
    opcua:
      good:
      - 0
      uncertain:
      - 64
      - 65
      - 66
      bad:
      - 128
      - 129
      - 130
    mqtt:
      good:
      - online
      - connected
      bad:
      - offline
      - disconnected
    modbus:
      good:
      - 0
      bad:
      - 1
      - 2
      - 3
      - 4
zerobus:
  enabled: true
  workspace_host: '${env:DATABRICKS_HOST}'
  zerobus_endpoint: '${env:ZEROBUS_ENDPOINT}'
  default_target:                  # the table of every source without a target_table of its own
    workspace_host: '${env:DATABRICKS_HOST}'
    catalog: opcua
    schema: scada_data
    table: opcua_events_bronze
  auth:
    # or the encrypted credential store: ${credential:zerobus.client_id} / ${credential:zerobus.client_secret}
    # (python -m unified_connector.core.credential_manager store ...)
    client_id: '${env:DATABRICKS_CLIENT_ID}'
    client_secret: '${env:DATABRICKS_CLIENT_SECRET}'
  confirmed_writes: false          # true: every table's batches are kept until Zerobus acknowledges them
                                   # (a table with Sparkplug rows always has them)
  wal:                             # a write-ahead log for the confirmed-writes tables (rows survive a crash)
    enabled: false
    path: wal
  batch:
    max_records: 1000
    timeout_seconds: 5.0
  source_targets: {}
  proxy:
    enabled: false
    use_env_vars: true
    http_proxy: ''
    https_proxy: ''
    no_proxy: localhost,127.0.0.1
numeric_compression:
  mode: sdt
  change_only: true
  deadband: 0.0
  sdt_deviation: 0.25
  sdt_max_interval_ms: 600000
  sdt_min_interval_ms: 0
  rules:
  - tag_path_regex: .*temperature.*
    mode: sdt
    sdt_deviation: 0.2
    sdt_max_interval_ms: 300000
  - tag_path_regex: .*status.*
    mode: change_only
backpressure:
  max_queue_size: 50000
  drop_policy: oldest
  disk_spool:
    enabled: true
    directory: ./spool
    max_size_mb: 500
    compression: gzip
credentials:
  storage:
    type: encrypted
    file: ~/.unified_connector/credentials.enc
monitoring:
  health_check:
    enabled: true
    port: 8081
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
  stats:
    enabled: true
    update_interval_seconds: 10
performance:
  max_concurrent_connections: 100
  connection_pool_size: 20
  read_buffer_size: 8192
  write_buffer_size: 8192
